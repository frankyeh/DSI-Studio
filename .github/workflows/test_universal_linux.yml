name: Test Universal Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing universal Linux packages (leave blank for latest)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Download universal Linux releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'dsi_studio_linux_universal_cpu*.zip' \
              --dir release
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'dsi_studio_linux_universal_legacy_cpu.zip' \
              --dir release
          else
            gh release download \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'dsi_studio_linux_universal_cpu*.zip' \
              --dir release
            gh release download \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'dsi_studio_linux_universal_legacy_cpu.zip' \
              --dir release
          fi
          test -s release/dsi_studio_linux_universal_cpu.zip
          test -s release/dsi_studio_linux_universal_cpu_arm64.zip
          test -s release/dsi_studio_linux_universal_legacy_cpu.zip
          sha256sum release/dsi_studio_linux_universal_*.zip

      - name: Save release packages
        uses: actions/upload-artifact@v4
        with:
          name: universal-linux-cpu-releases
          path: release/dsi_studio_linux_universal_*.zip
          if-no-files-found: error

  compatibility:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Legacy x86_64 targets use the glibc 2.17 universal legacy package.
          - name: Ubuntu 16.04 legacy x86_64
            arch: amd64
            package: legacy
            runner: ubuntu-22.04
            image: ubuntu:16.04
            family: apt-legacy
          - name: Debian 9 legacy x86_64
            arch: amd64
            package: legacy
            runner: ubuntu-22.04
            image: debian:9
            family: apt-legacy
          - name: CentOS 7 legacy x86_64
            arch: amd64
            package: legacy
            runner: ubuntu-22.04
            image: centos:7
            family: centos7

          # Standard x86_64 universal package.
          - name: Ubuntu 18.04 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: ubuntu:24.04
            family: apt
          - name: Debian 11 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: debian:11
            family: apt
          - name: Debian 12 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: debian:12
            family: apt
          - name: CentOS 8 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: quay.io/centos/centos:8
            family: centos8
          - name: Rocky Linux 8 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: rockylinux:8
            family: rhel
          - name: Rocky Linux 9 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: rockylinux:9
            family: rhel
          - name: AlmaLinux 8 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: almalinux:8
            family: rhel
          - name: AlmaLinux 9 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: almalinux:9
            family: rhel
          - name: openSUSE Leap 15.6 x86_64
            arch: amd64
            runner: ubuntu-22.04
            image: opensuse/leap:15.6
            family: suse

          # ARM64 universal package.
          - name: Ubuntu 18.04 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            family: apt
          - name: Debian 11 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:11
            family: apt
          - name: Debian 12 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:12
            family: apt
          - name: Rocky Linux 8 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: rockylinux:8
            family: rhel
          - name: Rocky Linux 9 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: rockylinux:9
            family: rhel
          - name: AlmaLinux 8 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: almalinux:8
            family: rhel
          - name: AlmaLinux 9 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: almalinux:9
            family: rhel
          - name: Amazon Linux 2023 ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            image: amazonlinux:2023
            family: amazon

    name: ${{ matrix.name }}
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: universal-linux-cpu-releases
          path: release

      - name: Extract package
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_KIND: ${{ matrix.package || 'standard' }}
        run: |
          set -euo pipefail
          mkdir -p package
          if [ "$PACKAGE_KIND" = "legacy" ]; then
            ZIP=dsi_studio_linux_universal_legacy_cpu.zip
            SOURCE_DIR=dsi-studio-linux-universal-legacy-cpu
          elif [ "$ARCH" = "arm64" ]; then
            ZIP=dsi_studio_linux_universal_cpu_arm64.zip
            SOURCE_DIR=dsi-studio-linux-universal-cpu-arm64
          else
            ZIP=dsi_studio_linux_universal_cpu.zip
            SOURCE_DIR=dsi-studio-linux-universal-cpu
          fi
          unzip -q "release/$ZIP" -d extracted
          mv "extracted/$SOURCE_DIR" package/dsi
          test -x package/dsi/dsi_studio

      - name: Test runtime compatibility
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_KIND: ${{ matrix.package || 'standard' }}
          DISTRO_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail

          cat > /tmp/test-universal-linux.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "== System =="
          cat /etc/os-release || true
          getconf GNU_LIBC_VERSION || true
          uname -m

          case "$ARCH" in
            amd64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "aarch64" ;;
            *) echo "Unknown architecture: $ARCH"; exit 1 ;;
          esac

          case "$FAMILY" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              if ! apt-get update; then
                if [ -f /etc/apt/sources.list ]; then
                  sed -i \
                    -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                    -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                    -e 's|http://ports.ubuntu.com/ubuntu-ports|http://old-releases.ubuntu.com/ubuntu|g' \
                    /etc/apt/sources.list
                fi
                apt-get update
              fi
              apt-get install -y --no-install-recommends \
                libgl1 \
                libglx0 \
                libegl1 \
                libopengl0 \
                libglu1-mesa \
                libdrm2 \
                libgbm1 \
                libglapi-mesa \
                zlib1g
              ;;

            apt-legacy)
              export DEBIAN_FRONTEND=noninteractive
              if ! apt-get update; then
                if [ -f /etc/apt/sources.list ]; then
                  sed -i \
                    -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                    -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                    -e 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' \
                    -e 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' \
                    -e 's|http://security.debian.org/debian|http://archive.debian.org/debian-security|g' \
                    /etc/apt/sources.list
                fi
                apt-get -o Acquire::Check-Valid-Until=false update
              fi
              apt-get install -y --no-install-recommends \
                libgl1-mesa-glx \
                libegl1-mesa \
                libglu1-mesa \
                libdrm2 \
                libgbm1 \
                libglapi-mesa \
                zlib1g
              ;;

            centos7)
              rm -f /etc/yum.repos.d/*.repo
              cat > /etc/yum.repos.d/vault.repo <<'REPO'
          [base]
          name=CentOS 7 Base
          baseurl=http://vault.centos.org/7.9.2009/os/$basearch/
          enabled=1
          gpgcheck=0

          [updates]
          name=CentOS 7 Updates
          baseurl=http://vault.centos.org/7.9.2009/updates/$basearch/
          enabled=1
          gpgcheck=0

          [extras]
          name=CentOS 7 Extras
          baseurl=http://vault.centos.org/7.9.2009/extras/$basearch/
          enabled=1
          gpgcheck=0
          REPO
              yum -y install \
                mesa-libGL \
                mesa-libEGL \
                mesa-libGLU \
                libdrm \
                mesa-libgbm \
                mesa-libglapi \
                zlib
              ;;

            centos8)
              rm -f /etc/yum.repos.d/*.repo
              cat > /etc/yum.repos.d/vault.repo <<'REPO'
          [baseos]
          name=CentOS 8 BaseOS
          baseurl=http://vault.centos.org/8.5.2111/BaseOS/$basearch/os/
          enabled=1
          gpgcheck=0

          [appstream]
          name=CentOS 8 AppStream
          baseurl=http://vault.centos.org/8.5.2111/AppStream/$basearch/os/
          enabled=1
          gpgcheck=0
          REPO
              dnf -y install \
                libglvnd-opengl \
                libglvnd-glx \
                libglvnd-egl \
                mesa-libGLU \
                libdrm \
                mesa-libgbm \
                mesa-libglapi \
                zlib
              ;;

            rhel)
              dnf -y install \
                libglvnd-opengl \
                libglvnd-glx \
                libglvnd-egl \
                mesa-libGLU \
                libdrm \
                mesa-libgbm \
                mesa-libglapi \
                zlib
              ;;

            amazon)
              dnf -y install \
                libglvnd-opengl \
                libglvnd-glx \
                libglvnd-egl \
                mesa-libGLU \
                libdrm \
                mesa-libgbm \
                mesa-libglapi \
                zlib
              ;;

            suse)
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends \
                libglvnd \
                Mesa-libGL1 \
                Mesa-libEGL1 \
                libGLU1 \
                libdrm2 \
                libgbm1 \
                Mesa-libglapi0 \
                libz1
              ;;
          esac

          export LD_LIBRARY_PATH=/dsi/lib:/dsi
          failures=0

          check_binary() {
            local file=$1 output
            echo "== ldd: $file =="
            if output=$(ldd "$file" 2>&1); then
              echo "$output"
            else
              echo "$output"
              failures=1
            fi
            if grep -qE 'not found|version [`'"'"'][^`'"'"']+[`'"'"'] not found' <<<"$output"; then
              failures=1
            fi
          }

          check_binary /dsi/dsi_studio

          echo "== Bundled library/plugin dependencies =="
          while IFS= read -r file; do
            check_binary "$file"
          done < <(find /dsi -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)

          echo "== Runtime smoke test =="
          if ! /dsi/dsi_studio --version; then
            failures=1
          fi

          if [ "$failures" -ne 0 ]; then
            echo "FAIL: runtime compatibility problems detected"
            exit 1
          fi

          echo "PASS: DSI Studio universal Linux $PACKAGE_KIND package loads successfully"
          SCRIPT

          chmod +x /tmp/test-universal-linux.sh

          set +e
          docker run --rm \
            --platform "linux/$ARCH" \
            -e FAMILY="$FAMILY" \
            -e ARCH="$ARCH" \
            -e PACKAGE_KIND="$PACKAGE_KIND" \
            -v "$PWD/package/dsi:/dsi:ro" \
            -v /tmp/test-universal-linux.sh:/test-universal-linux.sh:ro \
            "$IMAGE" \
            /bin/bash /test-universal-linux.sh
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "## $DISTRO_NAME: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## $DISTRO_NAME: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"
