          - Ubuntu 20.04
          - Ubuntu 22.04
          - Ubuntu 24.04
          - Ubuntu 26.04
          - Debian 9
          - Debian 10
          - Debian 11
          - Debian 12
          - Debian 13
          - CentOS 8
          - Rocky Linux 8
          - Rocky Linux 9
          - Rocky Linux 10
          - AlmaLinux 8
          - AlmaLinux 9
          - AlmaLinux 10
          - openSUSE Leap 15.6
          - Amazon Linux 2023
        include:
          - name: CentOS 7
            image: centos:7
            family: centos7
          - name: Amazon Linux 2
            image: amazonlinux:2
            family: amazon2
          - name: Ubuntu 16.04
            image: ubuntu:16.04
            family: apt-legacy
          - name: Ubuntu 18.04
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            family: apt
          - name: Debian 9
            image: debian:9
            family: debian-archive
          - name: Debian 10
            image: debian:10
            family: debian-archive
          - name: Debian 11
            image: debian:11
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: Debian 13
            image: debian:13
            family: apt
          - name: CentOS 8
            image: quay.io/centos/centos:8
