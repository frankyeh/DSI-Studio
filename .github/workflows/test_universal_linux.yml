name: Test Universal Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing universal Linux packages (leave blank for latest)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  x86_64:
    name: x86_64 / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 18.04
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Debian 11
            image: debian:11
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: CentOS 8
            image: quay.io/centos/centos:8
            family: centos8
          - name: Rocky Linux 8
            image: rockylinux:8
            family: rhel
          - name: Rocky Linux 9
            image: rockylinux:9
            family: rhel
          - name: AlmaLinux 8
            image: almalinux:8
            family: rhel
          - name: AlmaLinux 9
            image: almalinux:9
            family: rhel
          - name: openSUSE Leap 15.6
            image: opensuse/leap:15.6
            family: suse
    steps:
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'dsi_studio_linux_universal_cpu.zip' --dir release
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'dsi_studio_linux_universal_cpu.zip' --dir release
          fi
          unzip -q release/dsi_studio_linux_universal_cpu.zip -d extracted
          mv extracted/dsi-studio-linux-universal-cpu dsi
          test -x dsi/dsi_studio

      - name: Test runtime compatibility
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          DISTRO_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          cat > /tmp/test-universal-linux.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          cat /etc/os-release || true
          getconf GNU_LIBC_VERSION || true
          test "$(uname -m)" = "x86_64"

          case "$FAMILY" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              if ! apt-get update; then
                sed -i \
                  -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  /etc/apt/sources.list 2>/dev/null || true
                apt-get update
              fi
              apt-get install -y --no-install-recommends libgl1 libglx0 libegl1 libopengl0 libglu1-mesa libdrm2 libgbm1 libglapi-mesa zlib1g
              ;;
            centos8)
              rm -f /etc/yum.repos.d/*.repo
              cat > /etc/yum.repos.d/vault.repo <<'REPO'
          [baseos]
          baseurl=http://vault.centos.org/8.5.2111/BaseOS/$basearch/os/
          enabled=1
          gpgcheck=0
          [appstream]
          baseurl=http://vault.centos.org/8.5.2111/AppStream/$basearch/os/
          enabled=1
          gpgcheck=0
          REPO
              dnf -y install libglvnd-opengl libglvnd-glx libglvnd-egl mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            rhel)
              dnf -y install libglvnd-opengl libglvnd-glx libglvnd-egl mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            suse)
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends libglvnd Mesa-libGL1 Mesa-libEGL1 libGLU1 libdrm2 libgbm1 Mesa-libglapi0 libz1
              ;;
          esac

          export LD_LIBRARY_PATH=/dsi/lib:/dsi
          failures=0
          check_binary() {
            local file=$1 output
            echo "== ldd: $file =="
            if output=$(ldd "$file" 2>&1); then echo "$output"; else echo "$output"; failures=1; fi
            grep -qE 'not found|version [`'"'"'][^`'"'"']+[`'"'"'] not found' <<<"$output" && failures=1 || true
          }

          check_binary /dsi/dsi_studio
          while IFS= read -r file; do check_binary "$file"; done < <(find /dsi -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)
          /dsi/dsi_studio --version || failures=1
          test "$failures" -eq 0
          SCRIPT

          chmod +x /tmp/test-universal-linux.sh
          set +e
          docker run --rm --platform linux/amd64 \
            -e FAMILY="$FAMILY" \
            -v "$PWD/dsi:/dsi:ro" \
            -v /tmp/test-universal-linux.sh:/test-universal-linux.sh:ro \
            "$IMAGE" /bin/bash /test-universal-linux.sh
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "## x86_64 / $DISTRO_NAME: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## x86_64 / $DISTRO_NAME: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  arm64:
    name: ARM64 / ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 18.04
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Debian 11
            image: debian:11
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: Rocky Linux 8
            image: rockylinux:8
            family: rhel
          - name: Rocky Linux 9
            image: rockylinux:9
            family: rhel
          - name: AlmaLinux 8
            image: almalinux:8
            family: rhel
          - name: AlmaLinux 9
            image: almalinux:9
            family: rhel
          - name: Amazon Linux 2023
            image: amazonlinux:2023
            family: amazon
    steps:
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'dsi_studio_linux_universal_cpu_arm64.zip' --dir release
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'dsi_studio_linux_universal_cpu_arm64.zip' --dir release
          fi
          unzip -q release/dsi_studio_linux_universal_cpu_arm64.zip -d extracted
          mv extracted/dsi-studio-linux-universal-cpu-arm64 dsi
          test -x dsi/dsi_studio
          file dsi/dsi_studio | grep -q 'ARM aarch64'

      - name: Test runtime compatibility
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          DISTRO_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          cat > /tmp/test-universal-linux.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          cat /etc/os-release || true
          getconf GNU_LIBC_VERSION || true
          test "$(uname -m)" = "aarch64"

          case "$FAMILY" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              if ! apt-get update; then
                sed -i \
                  -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  -e 's|http://ports.ubuntu.com/ubuntu-ports|http://old-releases.ubuntu.com/ubuntu|g' \
                  /etc/apt/sources.list 2>/dev/null || true
                apt-get update
              fi
              apt-get install -y --no-install-recommends libgl1 libglx0 libegl1 libopengl0 libglu1-mesa libdrm2 libgbm1 libglapi-mesa zlib1g
              ;;
            rhel)
              dnf -y install libglvnd-opengl libglvnd-glx libglvnd-egl mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            amazon)
              dnf -y install libglvnd-opengl libglvnd-glx libglvnd-egl mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
          esac

          export LD_LIBRARY_PATH=/dsi/lib:/dsi
          failures=0
          check_binary() {
            local file=$1 output
            echo "== ldd: $file =="
            if output=$(ldd "$file" 2>&1); then echo "$output"; else echo "$output"; failures=1; fi
            grep -qE 'not found|version [`'"'"'][^`'"'"']+[`'"'"'] not found' <<<"$output" && failures=1 || true
          }

          check_binary /dsi/dsi_studio
          while IFS= read -r file; do check_binary "$file"; done < <(find /dsi -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)
          /dsi/dsi_studio --version || failures=1
          test "$failures" -eq 0
          SCRIPT

          chmod +x /tmp/test-universal-linux.sh
          set +e
          docker run --rm --platform linux/arm64 \
            -e FAMILY="$FAMILY" \
            -v "$PWD/dsi:/dsi:ro" \
            -v /tmp/test-universal-linux.sh:/test-universal-linux.sh:ro \
            "$IMAGE" /bin/bash /test-universal-linux.sh
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "## ARM64 / $DISTRO_NAME: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ARM64 / $DISTRO_NAME: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  legacy:
    name: Legacy / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CentOS 7
            image: centos:7
            family: centos7
          - name: Amazon Linux 2
            image: amazonlinux:2
            family: amazon2
          - name: Ubuntu 16.04
            image: ubuntu:16.04
            family: apt-legacy
          - name: Ubuntu 18.04
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Debian 9
            image: debian:9
            family: debian-archive
          - name: Debian 10
            image: debian:10
            family: debian-archive
          - name: Debian 11
            image: debian:11
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: CentOS 8
            image: quay.io/centos/centos:8
            family: centos8
          - name: Rocky Linux 8
            image: rockylinux:8
            family: rhel
          - name: Rocky Linux 9
            image: rockylinux:9
            family: rhel
          - name: AlmaLinux 8
            image: almalinux:8
            family: rhel
          - name: AlmaLinux 9
            image: almalinux:9
            family: rhel
          - name: openSUSE Leap 15.6
            image: opensuse/leap:15.6
            family: suse
          - name: Amazon Linux 2023
            image: amazonlinux:2023
            family: amazon
    steps:
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'dsi_studio_linux_universal_legacy_cpu.zip' --dir release
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'dsi_studio_linux_universal_legacy_cpu.zip' --dir release
          fi
          unzip -q release/dsi_studio_linux_universal_legacy_cpu.zip -d extracted
          mv extracted/dsi-studio-linux-universal-legacy-cpu dsi
          test -x dsi/dsi_studio
          file dsi/dsi_studio | grep -q 'x86-64'
          test -s dsi/lib/libOpenGL.so.0
          test -s dsi/lib/libGLX.so.0
          test -s dsi/lib/libGLdispatch.so.0

      - name: Test runtime compatibility
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          DISTRO_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          cat > /tmp/test-universal-linux.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          cat /etc/os-release || true
          getconf GNU_LIBC_VERSION || true
          test "$(uname -m)" = "x86_64"

          case "$FAMILY" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              if ! apt-get update; then
                sed -i \
                  -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  /etc/apt/sources.list 2>/dev/null || true
                apt-get update
              fi
              apt-get install -y --no-install-recommends libgl1 libglx0 libegl1 libopengl0 libglu1-mesa libdrm2 libgbm1 libglapi-mesa zlib1g
              ;;
            apt-legacy)
              export DEBIAN_FRONTEND=noninteractive
              if ! apt-get update; then
                sed -i \
                  -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
                  /etc/apt/sources.list 2>/dev/null || true
                apt-get -o Acquire::Check-Valid-Until=false update
              fi
              apt-get install -y --no-install-recommends libgl1-mesa-glx libegl1-mesa libglu1-mesa libdrm2 libgbm1 libglapi-mesa zlib1g
              ;;
            debian-archive)
              export DEBIAN_FRONTEND=noninteractive
              . /etc/os-release
              cat > /etc/apt/sources.list <<EOF
          deb [trusted=yes] http://archive.debian.org/debian $VERSION_CODENAME main
          deb [trusted=yes] http://archive.debian.org/debian-security $VERSION_CODENAME/updates main
          EOF
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get install -y --no-install-recommends libgl1-mesa-glx libegl1-mesa libglu1-mesa libdrm2 libgbm1 libglapi-mesa zlib1g
              ;;
            centos7)
              rm -f /etc/yum.repos.d/*.repo
              cat > /etc/yum.repos.d/vault.repo <<'REPO'
          [base]
          baseurl=http://vault.centos.org/7.9.2009/os/$basearch/
          enabled=1
          gpgcheck=0
          [updates]
          baseurl=http://vault.centos.org/7.9.2009/updates/$basearch/
          enabled=1
          gpgcheck=0
          [extras]
          baseurl=http://vault.centos.org/7.9.2009/extras/$basearch/
          enabled=1
          gpgcheck=0
          REPO
              yum -y install mesa-libGL mesa-libEGL mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            centos8)
              rm -f /etc/yum.repos.d/*.repo
              cat > /etc/yum.repos.d/vault.repo <<'REPO'
          [baseos]
          baseurl=http://vault.centos.org/8.5.2111/BaseOS/$basearch/os/
          enabled=1
          gpgcheck=0
          [appstream]
          baseurl=http://vault.centos.org/8.5.2111/AppStream/$basearch/os/
          enabled=1
          gpgcheck=0
          REPO
              dnf -y install libglvnd-opengl libglvnd-glx libglvnd-egl mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            rhel)
              dnf -y install libglvnd-opengl libglvnd-glx libglvnd-egl mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            amazon2)
              yum -y install mesa-libGL mesa-libEGL mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            amazon)
              dnf -y install libglvnd-opengl libglvnd-glx libglvnd-egl mesa-libGLU libdrm mesa-libgbm mesa-libglapi zlib
              ;;
            suse)
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends libglvnd Mesa-libGL1 Mesa-libEGL1 libGLU1 libdrm2 libgbm1 Mesa-libglapi0 libz1
              ;;
          esac

          test -s /dsi/lib/libOpenGL.so.0
          test -s /dsi/lib/libGLX.so.0
          test -s /dsi/lib/libGLdispatch.so.0

          failures=0
          check_binary() {
            local file=$1 output
            echo "== ldd: $file =="
            if output=$(ldd "$file" 2>&1); then echo "$output"; else echo "$output"; failures=1; fi
            grep -qE 'not found|version [`'"'"'][^`'"'"']+[`'"'"'] not found' <<<"$output" && failures=1 || true
          }

          main_ldd="$(ldd /dsi/dsi_studio 2>&1 || true)"
          echo "$main_ldd"
          grep -Fq 'libOpenGL.so.0 => /dsi/lib/libOpenGL.so.0' <<<"$main_ldd" || failures=1
          check_binary /dsi/dsi_studio
          while IFS= read -r file; do check_binary "$file"; done < <(find /dsi -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)
          /dsi/dsi_studio --version || failures=1
          test "$failures" -eq 0
          SCRIPT

          chmod +x /tmp/test-universal-linux.sh
          set +e
          docker run --rm --platform linux/amd64 \
            -e FAMILY="$FAMILY" \
            -v "$PWD/dsi:/dsi:ro" \
            -v /tmp/test-universal-linux.sh:/test-universal-linux.sh:ro \
            "$IMAGE" /bin/bash /test-universal-linux.sh
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "## Legacy / $DISTRO_NAME: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Legacy / $DISTRO_NAME: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
