name: Test Universal Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing universal Linux packages (leave blank for latest)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  x86_64:
    name: x86_64 ${{ matrix.variant }} / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [CPU, CUDA]
        name:
          - Ubuntu 18.04
          - Ubuntu 20.04
          - Ubuntu 22.04
          - Ubuntu 24.04
          - Ubuntu 26.04
          - Debian 11
          - Debian 12
          - Debian 13
          - CentOS 8
          - Rocky Linux 8
          - Rocky Linux 9
          - Rocky Linux 10
          - AlmaLinux 8
          - AlmaLinux 9
          - AlmaLinux 10
          - openSUSE Leap 15.6
        include:
          - name: Ubuntu 18.04
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            family: apt
          - name: Debian 11
            image: debian:11
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: Debian 13
            image: debian:13
            family: apt
          - name: CentOS 8
            image: quay.io/centos/centos:8
            family: centos8
          - name: Rocky Linux 8
            image: rockylinux:8
            family: rhel
          - name: Rocky Linux 9
            image: rockylinux:9
            family: rhel
          - name: Rocky Linux 10
            image: rockylinux/rockylinux:10
            family: rhel
          - name: AlmaLinux 8
            image: almalinux:8
            family: rhel
          - name: AlmaLinux 9
            image: almalinux:9
            family: rhel
          - name: AlmaLinux 10
            image: almalinux:10
            family: rhel
          - name: openSUSE Leap 15.6
            image: opensuse/leap:15.6
            family: suse
    steps:
      - uses: actions/checkout@v4
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" = CUDA ]; then
            asset=dsi_studio_linux_universal_cuda.zip
            package_dir=dsi-studio-linux-universal-cuda
          else
            asset=dsi_studio_linux_universal_cpu.zip
            package_dir=dsi-studio-linux-universal-cpu
          fi
          mkdir -p release
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release
          fi
          unzip -q "release/$asset" -d extracted
          mv "extracted/$package_dir" dsi
          test -x dsi/dsi_studio
          file dsi/dsi_studio | grep -q 'x86-64'
      - name: Test runtime compatibility
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          DISTRO_NAME: ${{ matrix.name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/test_universal_linux.sh
          set +e
          docker run --rm --platform linux/amd64 \
            -e FAMILY="$FAMILY" \
            -e EXPECT_ARCH=x86_64 \
            -v "$PWD/dsi:/dsi:ro" \
            -v "$PWD/.github/scripts/test_universal_linux.sh:/test-universal-linux.sh:ro" \
            "$IMAGE" /bin/bash /test-universal-linux.sh
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "## x86_64 $VARIANT / $DISTRO_NAME: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## x86_64 $VARIANT / $DISTRO_NAME: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  arm64:
    name: ARM64 ${{ matrix.variant }} / ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant: [CPU, CUDA]
        name:
          - Ubuntu 18.04
          - Ubuntu 20.04
          - Ubuntu 22.04
          - Ubuntu 24.04
          - Ubuntu 26.04
          - Debian 11
          - Debian 12
          - Debian 13
          - Rocky Linux 8
          - Rocky Linux 9
          - Rocky Linux 10
          - AlmaLinux 8
          - AlmaLinux 9
          - AlmaLinux 10
          - Amazon Linux 2023
        exclude:
          - variant: CUDA
            name: Ubuntu 18.04
          - variant: CUDA
            name: Ubuntu 20.04
          - variant: CUDA
            name: Debian 11
          - variant: CUDA
            name: Rocky Linux 8
          - variant: CUDA
            name: Rocky Linux 9
          - variant: CUDA
            name: AlmaLinux 8
          - variant: CUDA
            name: AlmaLinux 9
          - variant: CUDA
            name: Amazon Linux 2023
        include:
          - name: Ubuntu 18.04
            image: ubuntu:18.04
            family: apt
          - name: Ubuntu 20.04
            image: ubuntu:20.04
            family: apt
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            family: apt
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            family: apt
          - name: Debian 11
            image: debian:11
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: Debian 13
            image: debian:13
            family: apt
          - name: Rocky Linux 8
            image: rockylinux:8
            family: rhel
          - name: Rocky Linux 9
            image: rockylinux:9
            family: rhel
          - name: Rocky Linux 10
            image: rockylinux/rockylinux:10
            family: rhel
          - name: AlmaLinux 8
            image: almalinux:8
            family: rhel
          - name: AlmaLinux 9
            image: almalinux:9
            family: rhel
          - name: AlmaLinux 10
            image: almalinux:10
            family: rhel
          - name: Amazon Linux 2023
            image: amazonlinux:2023
            family: amazon
    steps:
      - uses: actions/checkout@v4
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" = CUDA ]; then
            asset=dsi_studio_linux_universal_cuda_arm64.zip
            package_dir=dsi-studio-linux-universal-cuda-arm64
          else
            asset=dsi_studio_linux_universal_cpu_arm64.zip
            package_dir=dsi-studio-linux-universal-cpu-arm64
          fi
          mkdir -p release
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release
          fi
          unzip -q "release/$asset" -d extracted
          mv "extracted/$package_dir" dsi
          test -x dsi/dsi_studio
          file dsi/dsi_studio | grep -q 'ARM aarch64'
      - name: Test runtime compatibility
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          DISTRO_NAME: ${{ matrix.name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/test_universal_linux.sh
          set +e
          docker run --rm --platform linux/arm64 \
            -e FAMILY="$FAMILY" \
            -e EXPECT_ARCH=aarch64 \
            -v "$PWD/dsi:/dsi:ro" \
            -v "$PWD/.github/scripts/test_universal_linux.sh:/test-universal-linux.sh:ro" \
            "$IMAGE" /bin/bash /test-universal-linux.sh
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "## ARM64 $VARIANT / $DISTRO_NAME: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ARM64 $VARIANT / $DISTRO_NAME: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  legacy:
