name: DSI Studio AI Test

on:
  workflow_dispatch:
    inputs:
      test_codex:
        description: Test Codex on the GitHub runner
        required: true
        type: boolean
        default: true
      test_claude:
        description: Test Claude on the GitHub runner
        required: true
        type: boolean
        default: false
      task_prompt:
        description: Task prompt for the selected runner agent(s)
        required: true
        default: "Use DSI Studio Fiber Data Hub to open a human FIB file, map the left arcuate fasciculus, save the tract, save tract statistics, capture a 3D screenshot, and write a brief summary."
      required_outputs:
        description: Comma- or newline-separated files expected under each agent output directory
        required: true
        default: "arcuate_fasciculus.tt.gz, arcuate_fasciculus_lr.png"
      model:
        description: Optional model name to mention to the agent
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Download Build
        shell: cmd
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.DSISTUDIO_TOKEN }}@github.com/frankyeh/DSI-Studio-Build.git
          move DSI-Studio-Build\*.txt .
          move DSI-Studio-Build\build_packages .

      - name: Install Qt
        uses: Kidev/install-qt-action@v4.6.0
        with:
          modules: qtcharts
          cache: true

      - name: Build Windows CPU
        shell: cmd
        run: |
          call .\build_packages\build_win.bat
          if not exist "dsi_studio_win\dsi_studio.exe" exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: dsi_studio_win_ai_test
          path: dsi_studio_win

  codex-test:
    name: AI pipe / Codex
    if: ${{ inputs.test_codex }}
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QT_OPENGL: software
      CODEX_THREAD_ID: 00000000-0000-4000-8000-000000000001
      AGENT_NAME: codex
      TASK_PROMPT: ${{ inputs.task_prompt }}
      REQUIRED_OUTPUTS: ${{ inputs.required_outputs }}
      MODEL_NAME: ${{ inputs.model }}

    steps:
      - name: Download DSI Studio
        uses: actions/download-artifact@v4
        with:
          name: dsi_studio_win_ai_test
          path: dsi_studio_win

      - name: Checkout DSI Studio AI manual into app directory
        uses: actions/checkout@v4
        with:
          repository: frankyeh/DSI-Studio-AI
          path: dsi_studio_win/ai

      - name: Prepare output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ai_output\codex | Out-Null
          Get-Item ai_output\codex

      - name: Start DSI Studio GUI local server
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dsi_studio_win\dsi_studio.exe).Path
          $work = Split-Path $exe
          $stdout = Join-Path (Resolve-Path ai_output\codex).Path "dsi_stdout.txt"
          $stderr = Join-Path (Resolve-Path ai_output\codex).Path "dsi_stderr.txt"
          $process = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "DSI_PID=$($process.Id)" >> $env:GITHUB_ENV

          for($i = 0; $i -lt 90; ++$i)
          {
            try
            {
              $pipe = [IO.Pipes.NamedPipeClientStream]::new('.','dsi-studio')
              $pipe.Connect(1000)
              $pipe.Dispose()
              Write-Host "DSI Studio pipe is ready."
              exit 0
            }
            catch
            {
              if($process.HasExited) { throw "DSI Studio exited before the pipe became ready." }
              Start-Sleep -Seconds 1
            }
          }
          throw "DSI Studio pipe did not become ready."

      - name: Direct local-pipe smoke test
        shell: pwsh
        run: |
          Push-Location dsi_studio_win\ai
          .\dsi.ps1 set_title "GitHub Actions Codex direct pipe smoke test" | Tee-Object ..\..\ai_output\codex\direct_set_title.json
          .\dsi.ps1 list_window | Tee-Object ..\..\ai_output\codex\direct_list_window.json
          .\dsi.ps1 hub_repo | Tee-Object ..\..\ai_output\codex\direct_hub_repo.json
          Pop-Location

      - name: Prepare agent prompt
        shell: pwsh
        run: |
          $out = (Resolve-Path ai_output\codex).Path
          $prompt = @"
          You are running inside GitHub Actions on the same Windows runner as DSI Studio.

          Read AGENTS.md first. Then read whichever DSI Studio AI manuals in this directory are needed for the task.

          Use only the local DSI Studio pipe through .\dsi.ps1 or bash ./dsi.sh. Do not use GUI clicking. Do not ask the user questions. Use DSI Studio's own commands, including Fiber Data Hub commands when data are needed.

          Output directory:
          $out

          Model preference, if relevant:
          $env:MODEL_NAME

          Dispatcher task:
          $env:TASK_PROMPT

          Write any required output files under the output directory above. Also write a short final report to:
          $out\agent_summary.txt
          "@
          $prompt = $prompt -replace '(?m)^          ', ''
          Set-Content -Path agent_prompt.md -Value $prompt -Encoding UTF8
          Get-Content agent_prompt.md

      - name: Install Codex
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) { throw "OPENAI_API_KEY secret is required for Codex." }
          npm install -g @openai/codex
          codex --version

      - name: Run Codex against DSI Studio
        shell: pwsh
        run: |
          $prompt = Get-Content agent_prompt.md -Raw
          Push-Location dsi_studio_win\ai
          $log = "..\..\ai_output\codex\codex.log"
          $attempts = @(
            @("exec","--skip-git-repo-check","--dangerously-bypass-approvals-and-sandbox",$prompt),
            @("exec","--skip-git-repo-check","--full-auto",$prompt),
            @("--full-auto",$prompt)
          )
          $ok = $false
          foreach($args in $attempts)
          {
            "Running: codex $($args[0]) ..." | Tee-Object -FilePath $log -Append
            & codex @args 2>&1 | Tee-Object -FilePath $log -Append
            if($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          Pop-Location
          if(!$ok) { throw "Codex failed. See ai_output/codex/codex.log." }

      - name: Verify Codex outputs
        shell: pwsh
        run: |
          Get-ChildItem ai_output\codex -Force
          $required = $env:REQUIRED_OUTPUTS -split "[\r\n,]+" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          foreach($file in $required)
          {
            $path = Join-Path (Resolve-Path ai_output\codex).Path $file
            if(!(Test-Path $path)) { throw "Missing Codex output: $file" }
          }

      - name: Stop DSI Studio
        if: always()
        shell: pwsh
        run: |
          if($env:DSI_PID)
          {
            Stop-Process -Id ([int]$env:DSI_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Codex AI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi-studio-ai-test-codex
          path: |
            ai_output/codex
            agent_prompt.md

  claude-test:
    name: AI pipe / Claude
    if: ${{ inputs.test_claude }}
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QT_OPENGL: software
      CLAUDE_CODE_SESSION_ID: 00000000-0000-4000-8000-000000000002
      CLAUDE_CODE_USE_POWERSHELL_TOOL: "1"
      AGENT_NAME: claude
      TASK_PROMPT: ${{ inputs.task_prompt }}
      REQUIRED_OUTPUTS: ${{ inputs.required_outputs }}
      MODEL_NAME: ${{ inputs.model }}

    steps:
      - name: Download DSI Studio
        uses: actions/download-artifact@v4
        with:
          name: dsi_studio_win_ai_test
          path: dsi_studio_win

      - name: Checkout DSI Studio AI manual into app directory
        uses: actions/checkout@v4
        with:
          repository: frankyeh/DSI-Studio-AI
          path: dsi_studio_win/ai

      - name: Prepare output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ai_output\claude | Out-Null
          Get-Item ai_output\claude

      - name: Start DSI Studio GUI local server
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dsi_studio_win\dsi_studio.exe).Path
          $work = Split-Path $exe
          $stdout = Join-Path (Resolve-Path ai_output\claude).Path "dsi_stdout.txt"
          $stderr = Join-Path (Resolve-Path ai_output\claude).Path "dsi_stderr.txt"
          $process = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "DSI_PID=$($process.Id)" >> $env:GITHUB_ENV

          for($i = 0; $i -lt 90; ++$i)
          {
            try
            {
              $pipe = [IO.Pipes.NamedPipeClientStream]::new('.','dsi-studio')
              $pipe.Connect(1000)
              $pipe.Dispose()
              Write-Host "DSI Studio pipe is ready."
              exit 0
            }
            catch
            {
              if($process.HasExited) { throw "DSI Studio exited before the pipe became ready." }
              Start-Sleep -Seconds 1
            }
          }
          throw "DSI Studio pipe did not become ready."

      - name: Direct local-pipe smoke test
        shell: pwsh
        run: |
          Push-Location dsi_studio_win\ai
          .\dsi.ps1 set_title "GitHub Actions Claude direct pipe smoke test" | Tee-Object ..\..\ai_output\claude\direct_set_title.json
          .\dsi.ps1 list_window | Tee-Object ..\..\ai_output\claude\direct_list_window.json
          .\dsi.ps1 hub_repo | Tee-Object ..\..\ai_output\claude\direct_hub_repo.json
          Pop-Location

      - name: Prepare agent prompt
        shell: pwsh
        run: |
          $out = (Resolve-Path ai_output\claude).Path
          $prompt = @"
          You are running inside GitHub Actions on the same Windows runner as DSI Studio.

          Read AGENTS.md first. Then read whichever DSI Studio AI manuals in this directory are needed for the task.

          Use only the local DSI Studio pipe through .\dsi.ps1 or bash ./dsi.sh. Do not use GUI clicking. Do not ask the user questions. Use DSI Studio's own commands, including Fiber Data Hub commands when data are needed.

          Output directory:
          $out

          Model preference, if relevant:
          $env:MODEL_NAME

          Dispatcher task:
          $env:TASK_PROMPT

          Write any required output files under the output directory above. Also write a short final report to:
          $out\agent_summary.txt
          "@
          $prompt = $prompt -replace '(?m)^          ', ''
          Set-Content -Path agent_prompt.md -Value $prompt -Encoding UTF8
          Get-Content agent_prompt.md

      - name: Install Claude
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:ANTHROPIC_API_KEY)) { throw "ANTHROPIC_API_KEY secret is required for Claude." }
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run Claude against DSI Studio
        shell: pwsh
        run: |
          $prompt = Get-Content agent_prompt.md -Raw
          Push-Location dsi_studio_win\ai
          $log = "..\..\ai_output\claude\claude.log"
          $allowed = "Bash(bash ./dsi.sh:*),PowerShell(./dsi.ps1:*),Read,Glob,Grep,LS"
          $attempts = @(
            @("-p","--dangerously-skip-permissions","--allowedTools",$allowed,$prompt),
            @("-p","--allowedTools",$allowed,$prompt),
            @("-p",$prompt)
          )
          $ok = $false
          foreach($args in $attempts)
          {
            "Running: claude $($args[0]) ..." | Tee-Object -FilePath $log -Append
            & claude @args 2>&1 | Tee-Object -FilePath $log -Append
            if($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          Pop-Location
          if(!$ok) { throw "Claude failed. See ai_output/claude/claude.log." }

      - name: Verify Claude outputs
        shell: pwsh
        run: |
          Get-ChildItem ai_output\claude -Force
          $required = $env:REQUIRED_OUTPUTS -split "[\r\n,]+" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          foreach($file in $required)
          {
            $path = Join-Path (Resolve-Path ai_output\claude).Path $file
            if(!(Test-Path $path)) { throw "Missing Claude output: $file" }
          }

      - name: Stop DSI Studio
        if: always()
        shell: pwsh
        run: |
          if($env:DSI_PID)
          {
            Stop-Process -Id ([int]$env:DSI_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Claude AI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi-studio-ai-test-claude
          path: |
            ai_output/claude
            agent_prompt.md
