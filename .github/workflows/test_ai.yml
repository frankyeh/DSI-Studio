name: DSI Studio AI Test

on:
  workflow_dispatch:
    inputs:
      agent:
        description: AI agent to run after the direct pipe smoke test
        required: true
        type: choice
        default: codex
        options:
          - codex
          - claude
      fib_url:
        description: Fiber Data Hub FIB URL
        required: true
        default: https://github.com/data-hcp/lifespan/releases/download/hcp-ya/100206.gqi.fz
      model:
        description: Optional agent model name
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Download Build
        shell: cmd
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.DSISTUDIO_TOKEN }}@github.com/frankyeh/DSI-Studio-Build.git
          move DSI-Studio-Build\*.txt .
          move DSI-Studio-Build\build_packages .

      - name: Install Qt
        uses: Kidev/install-qt-action@v4.6.0
        with:
          modules: qtcharts
          cache: true

      - name: Build Windows CPU
        shell: cmd
        run: |
          call .\build_packages\build_win.bat
          if not exist "dsi_studio_win\dsi_studio.exe" exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: dsi_studio_win_ai_test
          path: dsi_studio_win

  ai-test:
    name: AI pipe / ${{ inputs.agent }}
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QT_OPENGL: software

    steps:
      - name: Download DSI Studio
        uses: actions/download-artifact@v4
        with:
          name: dsi_studio_win_ai_test
          path: dsi_studio_win

      - name: Checkout DSI Studio AI manual into app directory
        uses: actions/checkout@v4
        with:
          repository: frankyeh/DSI-Studio-AI
          path: dsi_studio_win/ai

      - name: Download Fiber Data Hub FIB
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data,ai_output | Out-Null
          curl.exe -L --retry 3 "${{ inputs.fib_url }}" -o data\100206.gqi.fz
          if(!(Test-Path data\100206.gqi.fz)) { throw "FIB download failed." }
          Get-Item data\100206.gqi.fz

      - name: Start DSI Studio GUI local server
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dsi_studio_win\dsi_studio.exe).Path
          $work = Split-Path $exe
          $stdout = Join-Path (Resolve-Path ai_output).Path "dsi_stdout.txt"
          $stderr = Join-Path (Resolve-Path ai_output).Path "dsi_stderr.txt"
          $process = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "DSI_PID=$($process.Id)" >> $env:GITHUB_ENV

          for($i = 0; $i -lt 90; ++$i)
          {
            try
            {
              $pipe = [IO.Pipes.NamedPipeClientStream]::new('.','dsi-studio')
              $pipe.Connect(1000)
              $pipe.Dispose()
              Write-Host "DSI Studio pipe is ready."
              exit 0
            }
            catch
            {
              if($process.HasExited) { throw "DSI Studio exited before the pipe became ready." }
              Start-Sleep -Seconds 1
            }
          }
          throw "DSI Studio pipe did not become ready."

      - name: Direct local-pipe smoke test
        shell: pwsh
        run: |
          $env:CODEX_THREAD_ID = [guid]::NewGuid().ToString()
          Push-Location dsi_studio_win\ai
          .\dsi.ps1 set_title "GitHub Actions direct pipe smoke test" | Tee-Object ..\..\ai_output\direct_set_title.json
          .\dsi.ps1 list_window | Tee-Object ..\..\ai_output\direct_list_window.json
          Pop-Location

      - name: Prepare agent prompt
        shell: pwsh
        run: |
          $fib = (Resolve-Path data\100206.gqi.fz).Path
          $out = (Resolve-Path ai_output).Path
          $model = "${{ inputs.model }}"
          @"
You are running inside GitHub Actions on the same Windows runner as DSI Studio.

Read AGENTS.md first, then read the needed DSI Studio AI command guides:
- DSI_STUDIO_AI_SKILL_FIBER_TRACKING.md
- DSI_STUDIO_AI_COMMAND_EXAMPLES_TRACT.md
- DSI_STUDIO_AI_COMMAND_EXAMPLES_RENDERING.md

Use only the local DSI Studio pipe through .\dsi.ps1 or bash ./dsi.sh. Do not use GUI clicking. Do not ask the user questions.

Input FIB file from Fiber Data Hub:
$fib

Output directory:
$out

Task:
1. Set the DSI Studio task title to "GitHub Actions arcuate fasciculus test".
2. Open the FIB file above in DSI Studio using the local pipe.
3. Use DSI Studio AI commands to map the left arcuate fasciculus. Use list_auto_tract first and select the exact AutoTrack name for the left arcuate fasciculus rather than guessing.
4. Poll list_tract status until tracking is done.
5. Save the tract bundle exactly as:
$out\arcuate_fasciculus.tt.gz
6. Save tract statistics exactly as:
$out\arcuate_fasciculus_stat.txt
7. Set up a clear 3D view with tracts visible and save a screenshot exactly as:
$out\arcuate_fasciculus_lr.png
Use save_lr_screen with size "1600 1000" unless the manual indicates a better command.
8. Run preview_screen 3d and save your own final text summary exactly as:
$out\agent_summary.txt

The run is successful only if arcuate_fasciculus.tt.gz and arcuate_fasciculus_lr.png exist.
"@ | Set-Content -Path agent_prompt.md -Encoding UTF8
          Get-Content agent_prompt.md

      - name: Install selected agent
        shell: pwsh
        run: |
          if("${{ inputs.agent }}" -eq "codex")
          {
            if([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) { throw "OPENAI_API_KEY secret is required for codex." }
            npm install -g @openai/codex
            codex --version
          }
          else
          {
            if([string]::IsNullOrWhiteSpace($env:ANTHROPIC_API_KEY)) { throw "ANTHROPIC_API_KEY secret is required for claude." }
            npm install -g @anthropic-ai/claude-code
            claude --version
          }

      - name: Run Codex against DSI Studio
        if: ${{ inputs.agent == 'codex' }}
        shell: pwsh
        env:
          CODEX_THREAD_ID: 00000000-0000-4000-8000-000000000001
        run: |
          $prompt = Get-Content agent_prompt.md -Raw
          Push-Location dsi_studio_win\ai
          $log = "..\..\ai_output\codex.log"
          $attempts = @(
            @("exec","--skip-git-repo-check","--dangerously-bypass-approvals-and-sandbox",$prompt),
            @("exec","--skip-git-repo-check","--full-auto",$prompt),
            @("--full-auto",$prompt)
          )
          $ok = $false
          foreach($args in $attempts)
          {
            "Running: codex $($args[0]) ..." | Tee-Object -FilePath $log -Append
            & codex @args 2>&1 | Tee-Object -FilePath $log -Append
            if($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          Pop-Location
          if(!$ok) { throw "Codex failed. See ai_output/codex.log." }

      - name: Run Claude against DSI Studio
        if: ${{ inputs.agent == 'claude' }}
        shell: pwsh
        env:
          CLAUDE_CODE_SESSION_ID: 00000000-0000-4000-8000-000000000002
          CLAUDE_CODE_USE_POWERSHELL_TOOL: "1"
        run: |
          $prompt = Get-Content agent_prompt.md -Raw
          Push-Location dsi_studio_win\ai
          $log = "..\..\ai_output\claude.log"
          $allowed = "Bash(bash ./dsi.sh:*),PowerShell(./dsi.ps1:*),Read,Glob,Grep,LS"
          $attempts = @(
            @("-p","--dangerously-skip-permissions","--allowedTools",$allowed,$prompt),
            @("-p","--allowedTools",$allowed,$prompt),
            @("-p",$prompt)
          )
          $ok = $false
          foreach($args in $attempts)
          {
            "Running: claude $($args[0]) ..." | Tee-Object -FilePath $log -Append
            & claude @args 2>&1 | Tee-Object -FilePath $log -Append
            if($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          Pop-Location
          if(!$ok) { throw "Claude failed. See ai_output/claude.log." }

      - name: Verify AI outputs
        shell: pwsh
        run: |
          Get-ChildItem ai_output -Force
          if(!(Test-Path ai_output\arcuate_fasciculus.tt.gz)) { throw "Missing arcuate_fasciculus.tt.gz" }
          if(!(Test-Path ai_output\arcuate_fasciculus_lr.png)) { throw "Missing arcuate_fasciculus_lr.png" }

      - name: Stop DSI Studio
        if: always()
        shell: pwsh
        run: |
          if($env:DSI_PID)
          {
            Stop-Process -Id ([int]$env:DSI_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload AI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi-studio-ai-test-${{ inputs.agent }}
          path: |
            ai_output
            agent_prompt.md
