name: Temporary direct repaint patch

on:
  push:
    branches: [chatgpt-direct-ai-repaint]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('ai_agent.cpp')
          s = p.read_text()

          old = '''    title->setToolTip(title->text());
    item->setSizeHint(QSize(0,row->sizeHint().height()));'''
          new = '''    title->setToolTip(title->text());
    title->repaint();
    item->setSizeHint(QSize(0,row->sizeHint().height()));'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,new)

          old = '''    QTimer::singleShot(
        0,bar,[bar]{bar->setValue(bar->maximum());});
}'''
          new = '''    QTimer::singleShot(
        0,bar,[bar]{bar->setValue(bar->maximum());});
    ui->ai_chat_history->viewport()->repaint();
}'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s)
          PY

          git restore --source=e989d3017b7195e991ad3905fab72d2780b002a3 -- main.cpp
          git rm .github/workflows/chatgpt_direct_repaint.yml
          git add ai_agent.cpp main.cpp
          git diff --cached --check
          git diff --cached --name-status

          git config user.name 'Fang-Cheng (Frank) Yeh'
          git config user.email 'frank.yeh@gmail.com'
          git commit -m 'Refresh AI chat widgets directly'
          git push origin HEAD:chatgpt-direct-ai-repaint
