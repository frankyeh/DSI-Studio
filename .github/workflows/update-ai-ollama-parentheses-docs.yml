name: Update Ollama identity format docs

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-ai-ollama-parentheses-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI setup and manual
        shell: python
        run: |
          from pathlib import Path

          setup_path = Path("ai/DSI_STUDIO_AI_SETUP.md")
          setup = setup_path.read_text(encoding="utf-8")
          setup = setup.replace(
              "Codex/Ollama@192.168.1.14",
              "Codex/Ollama(192.168.1.14)")
          setup = setup.replace(
              "Claude/Ollama@192.168.1.14",
              "Claude/Ollama(192.168.1.14)")
          setup = setup.replace(
              "The `@` in\n`Ollama@host` is valid and is part of the agent name.",
              "The parenthesized host is part of the agent name.")
          setup = setup.replace(
              "The optional\ncombined wrapper form is `<full-agent>@<session>` and must be split at the\nfinal `@`; an Ollama identity therefore looks like",
              "The optional combined wrapper form is `<agent>@<session>` and is split at\nits single `@`; an Ollama identity therefore looks like")
          setup = setup.replace(
              "$separator = $Identity.LastIndexOf('@')",
              "$separator = $Identity.IndexOf('@')")
          setup = setup.replace(
              "Write-Error 'Identity must end with @session; the agent may contain Ollama@host.'",
              "Write-Error 'Identity must be agent@session.'")
          setup = setup.replace(
              "Use the same `<full-agent>@<session>` identity for the entire conversation.\nBecause an Ollama agent already contains `@host`, the wrapper separates the\nsession at the final `@`. Each script invocation sends exactly one request\nthrough `dsi_studio.exe` and exits. Use the same generated script for all\nrequests; do not regenerate it per request or create additional PowerShell,\nPython, or batch clients.",
              "Use the same `agent@session` identity for the entire conversation. The agent\nname contains no `@`, so the wrapper separates agent and session at the first\n`@`. Each script invocation sends exactly one request through `dsi_studio.exe`\nand exits. Use the same generated script for all requests; do not regenerate it\nper request or create additional PowerShell, Python, or batch clients.")
          setup = setup.replace(
              "# Ollama-backed Codex; quote the combined identity.",
              "# Ollama-backed Codex.")
          for obsolete in (
              "Ollama@192.168.1.14",
              "Ollama@host",
              "LastIndexOf('@')",
              "session at the final `@`"):
              if obsolete in setup:
                  raise RuntimeError(f"obsolete setup text remains: {obsolete}")
          setup_path.write_text(setup, encoding="utf-8")

          manual_path = Path("ai/DSI_STUDIO_AI_MANUAL.md")
          manual = manual_path.read_text(encoding="utf-8")
          manual = manual.replace(
              "Codex/Ollama@192.168.1.14",
              "Codex/Ollama(192.168.1.14)")
          manual = manual.replace(
              "Claude/Ollama@192.168.1.14",
              "Claude/Ollama(192.168.1.14)")
          manual = manual.replace(
              "The `@` in\n  `Ollama@host` is valid and part of the agent name. Do not shorten or alter it.",
              "The parenthesized host is part of the agent name. Do not shorten or alter it.")
          for obsolete in ("Ollama@192.168.1.14", "Ollama@host"):
              if obsolete in manual:
                  raise RuntimeError(f"obsolete manual text remains: {obsolete}")
          manual_path.write_text(manual, encoding="utf-8")

          Path(".github/workflows/update-ai-ollama-parentheses-docs.yml").unlink()

      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/DSI_STUDIO_AI_SETUP.md ai/DSI_STUDIO_AI_MANUAL.md .github/workflows/update-ai-ollama-parentheses-docs.yml
          git commit -m "Use parenthesized Ollama agent host"
          git push
