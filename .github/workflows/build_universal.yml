name: Build Universal Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true
        default: '2026.7.25'

jobs:
  linux-universal-build:
    runs-on: ubuntu-latest
    steps:
    - name: Download Build
      run: |
        git clone https://x-access-token:${{ secrets.DSISTUDIO_TOKEN }}@github.com/frankyeh/DSI-Studio-Build.git
        mv DSI-Studio-Build/build_packages .

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.0.0

    - name: Build universal Linux CPU package
      uses: docker/build-push-action@v5.1.0
      with:
        context: .
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          DSISTUDIO_TOKEN=${{ secrets.DSISTUDIO_TOKEN }}
        file: build_packages/universal/Dockerfile
        push: false
        outputs: dsi-studio-linux-universal-cpu

    - name: Verify package
      run: |
        test -x dsi-studio-linux-universal-cpu/dsi_studio
        if find dsi-studio-linux-universal-cpu \( \
          -name 'libc.so*' -o \
          -name 'ld-linux*.so*' -o \
          -name 'libpthread.so*' -o \
          -name 'libm.so*' -o \
          -name 'libdl.so*' -o \
          -name 'librt.so*' -o \
          -name 'libresolv.so*' -o \
          -name 'libutil.so*' -o \
          -name 'libnss_*.so*' -o \
          -name 'libanl.so*' \
        \) -print -quit | grep -q .; then
          echo "Error: universal package includes glibc/core runtime libraries"
          find dsi-studio-linux-universal-cpu \( \
            -name 'libc.so*' -o \
            -name 'ld-linux*.so*' -o \
            -name 'libpthread.so*' -o \
            -name 'libm.so*' -o \
            -name 'libdl.so*' -o \
            -name 'librt.so*' -o \
            -name 'libresolv.so*' -o \
            -name 'libutil.so*' -o \
            -name 'libnss_*.so*' -o \
            -name 'libanl.so*' \
          \) -print
          exit 1
        fi
        zip -r dsi_studio_linux_universal_cpu.zip dsi-studio-linux-universal-cpu

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.DSISTUDIO_TOKEN }}
      run: |
        gh release upload ${{ github.event.inputs.tag }} dsi_studio_linux_universal_cpu.zip --clobber --repo frankyeh/DSI-Studio
