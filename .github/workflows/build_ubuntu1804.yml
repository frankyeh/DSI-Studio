name: Build Ubuntu 18.04 CPU

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  ubuntu1804-cpu:
    runs-on: ubuntu-24.04
    steps:
      - name: Download build files
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.DSISTUDIO_TOKEN }}@github.com/frankyeh/DSI-Studio-Build.git
          mv DSI-Studio-Build/build_packages .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu 18.04 CPU package
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSISTUDIO_TOKEN=${{ secrets.DSISTUDIO_TOKEN }}
          file: build_packages/ubuntu1804/Dockerfile
          push: false
          outputs: dsi-studio-ubuntu1804-cpu

      - name: Verify and package
        run: |
          test -x dsi-studio-ubuntu1804-cpu/dsi_studio
          if find dsi-studio-ubuntu1804-cpu \( \
            -name 'libc.so*' -o \
            -name 'ld-linux*.so*' -o \
            -name 'libpthread.so*' -o \
            -name 'libm.so*' -o \
            -name 'libdl.so*' -o \
            -name 'librt.so*' \
          \) -print -quit | grep -q .; then
            echo 'Error: Ubuntu 18.04 package includes glibc/core runtime libraries'
            exit 1
          fi
          zip -r dsi_studio_ubuntu1804_cpu.zip dsi-studio-ubuntu1804-cpu

      - name: Upload release
        env:
          GH_TOKEN: ${{ secrets.DSISTUDIO_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" dsi_studio_ubuntu1804_cpu.zip --clobber --repo frankyeh/DSI-Studio
